<style>
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:#091019;color:#f4ead7;font:15px 'Malgun Gothic',sans-serif;overflow-x:hidden}button,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}.topbar{min-height:64px;padding:13px 24px;border-bottom:1px solid #324654;background:#0c1621;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font:700 22px Georgia,serif;letter-spacing:5px;color:#f3d99a}.brand small{font:12px 'Malgun Gothic',sans-serif;letter-spacing:1px;color:#9db2b6}.toolbox{padding:10px 24px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:center;background:#0a131d}.toolbox label{display:flex;align-items:center;gap:7px;color:#b9c7c8}.toolbox select,.toolbox button,.screen-btn{min-height:38px;padding:8px 13px;border:1px solid #66808a;border-radius:4px;background:#1b3140;color:#fff3d6}.toolbox button:hover,.screen-btn:hover{border-color:#e9bd6e;background:#254353}.stage{position:relative;width:min(1200px,96vw);aspect-ratio:16/9;margin:12px auto;background:#102031;overflow:hidden;border:1px solid #506274;box-shadow:0 20px 55px #0008}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:pixelated}canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#06101c4d,transparent 46%,#06101c3d);pointer-events:none}.overlay{position:absolute;inset:0}.title-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(#04111a31,#04111a91)}.logo{font:700 clamp(48px,8vw,100px) Georgia,serif;letter-spacing:.14em;color:#f4d892;text-shadow:0 4px #102b3b,0 0 24px #e8b65452;margin:0}.subtitle{margin:4px 0 38px;letter-spacing:.45em;color:#c7d9d5}.menu{display:grid;gap:10px;width:min(280px,70%)}.menu .screen-btn{font-weight:bold;background:#102333e8;border:2px solid #bea260;box-shadow:inset 0 0 18px #0007}.version{position:absolute;bottom:17px;color:#93a8aa;font-size:12px}.select-screen{padding:5% 7%;background:#06101dcc}.select-screen h2{text-align:center;margin:0 0 7px;font:700 32px Georgia,serif;color:#f2d89c}.select-screen>p{text-align:center;color:#afc2c3;margin:0 0 18px}.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:850px;margin:auto}.hero-choice{height:340px;padding:18px;border:2px solid #586f78;border-radius:6px;background:#102130e8;color:#f7ead0;text-align:center;transition:transform .15s,border-color .15s,background .15s}.hero-choice:hover{transform:translateY(-5px);border-color:#efc573}.hero-choice.selected{border-color:#f3cf7d;background:#173548;box-shadow:0 0 0 3px #eec8752c}.hero-choice img{display:block;width:100%;height:220px;object-fit:contain;image-rendering:pixelated}.hero-choice b{display:block;font-size:20px}.hero-choice span{display:block;margin-top:6px;color:#b9cbcb}.select-go{display:block;margin:20px auto 0;min-width:230px;background:#9c6938;border-color:#f0c676}.hud{position:absolute;inset:0 0 auto;padding:13px 22px 25px;background:linear-gradient(#07111bef,transparent);display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:20px;pointer-events:none}.unit-status{min-width:230px}.unit-status.enemy{text-align:right}.unit-name{font-weight:bold;font-size:16px;text-shadow:0 2px #000}.bar{height:17px;margin-top:6px;background:#17242aab;overflow:hidden;box-shadow:inset 0 0 0 2px #0a1014}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#8c2935,#e35151);transition:width .35s}.bar.hero>i{background:linear-gradient(90deg,#21787f,#55c4b6)}.numbers{font-size:12px;color:#fff3d9}.intent{padding:8px 13px;border:1px solid #8da2a2;background:#102131d9;text-align:center;color:#ffe7bb}.status-line{position:absolute;top:18%;left:50%;transform:translateX(-50%);min-width:260px;padding:7px 16px;text-align:center;background:#08131bd9;border:1px solid #5e777d;color:#f6e2b4;opacity:0;transition:opacity .2s}.status-line.show{opacity:1}.turn-controls{position:absolute;right:2%;bottom:27%;display:grid;gap:8px}.turn-controls button{min-width:105px}.hand{position:absolute;left:12%;right:12%;bottom:1.2%;display:flex;justify-content:center;align-items:flex-end;gap:12px}.battle-card{width:150px;aspect-ratio:240/336;padding:12px 10px 9px;border:0;background:url('Assets/BRODUNArt/UI/card_attack.png') center/100% 100% no-repeat;color:#f4e2c0;text-align:center;position:relative;filter:drop-shadow(0 8px 8px #0009);transition:transform .14s,filter .14s}.battle-card.guard{background-image:url('Assets/BRODUNArt/UI/card_defense.png')}.battle-card:hover:not(:disabled){transform:translateY(-18px) scale(1.04);filter:drop-shadow(0 12px 11px #000)}.battle-card:disabled{filter:grayscale(.75) brightness(.55);opacity:.75}.battle-card.played{transform:translateY(-28px) scale(.94);filter:brightness(1.5) drop-shadow(0 0 15px #ffdb82)}.battle-card img{display:block;width:66%;height:38%;margin:14% auto 3%;object-fit:contain;image-rendering:pixelated}.battle-card b{display:block;font-size:14px}.battle-card p{margin:5px 0 0;font-size:11px;line-height:1.35}.cost{position:absolute;top:6%;left:10%;font-weight:bold;color:#fff}.energy{position:absolute;left:3%;bottom:4%;width:82px;height:82px;border-radius:50%;display:grid;place-content:center;background:radial-gradient(circle,#4d8fb4,#173453 66%,#07131e 68%);border:3px solid #d3e6dc;box-shadow:0 0 20px #57c9ff57;text-align:center}.energy strong{font-size:25px}.energy small{font-size:10px;color:#d9eff3}.damage-pop{position:absolute;z-index:9;font:bold 34px Georgia,serif;color:#fff0bc;text-shadow:2px 3px #8f1c24;animation:pop 1s forwards;pointer-events:none}.block-pop{color:#aeefff;text-shadow:2px 3px #145778}.stage.shake{animation:shake .3s}.stage.flash:after{content:"";position:absolute;inset:0;background:#fff8;animation:flash .22s forwards;pointer-events:none}.panel{position:absolute;left:23%;top:15%;width:54%;padding:32px 24px;background:#0d202df4;border:3px solid #c6b27d;text-align:center;box-shadow:0 18px 45px #000a}.panel h2{margin:0 0 14px;font:700 36px Georgia,serif;color:#f2d48e}.panel p{line-height:1.7;color:#c7d5d2}.rewards{display:flex;justify-content:center;gap:13px;margin:18px 0}.reward{width:125px;padding:9px;border:1px solid #71898c;background:#152d3b;color:#f1e2c4}.reward:hover{border-color:#edc571}.reward img{width:60px;height:60px;object-fit:contain;image-rendering:pixelated}.maphead{background:#081521e9;padding:14px 22px;font-weight:bold}.mapnodes{position:absolute;inset:14% 4% 6%;background:#071320b8;border:1px solid #617783}.node{position:absolute;width:65px;height:65px;border-radius:50%;background:#152d3c;border:2px solid #87a3a2;transform:translate(-50%,-50%);padding:7px;color:#fff}.node.done{border-color:#e2c576;background:#365344}.node img{width:100%;height:100%;object-fit:contain}.node em{position:absolute;top:62px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:12px}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;max-width:1200px;margin:22px auto;padding:0 12px}.tile{padding:13px;background:#152430;border:1px solid #344955}.tile img{width:100%;height:225px;object-fit:contain;background:repeating-conic-gradient(#22313b 0 25%,#192831 0 50%) 0/20px 20px;image-rendering:pixelated}.tile h3{word-break:break-all}.note{max-width:1200px;margin:18px auto 28px;padding:0 14px;color:#aebfc1;line-height:1.7}.note a{color:#aee1e3}.recording .topbar,.recording .toolbox,.recording .note{display:none}.recording .stage{width:100vw;max-width:none;margin:0;border:0;box-shadow:none}.record-tip{display:none;position:absolute;right:10px;top:10px;z-index:12;padding:5px 9px;background:#071019a8;color:#9db1b5;font-size:11px}.recording .record-tip{display:block;animation:tipfade 4s forwards}
@keyframes pop{0%{opacity:0;transform:translateY(20px) scale(.5)}20%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-60px) scale(1)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}55%{transform:translateX(7px)}75%{transform:translateX(-4px)}}@keyframes flash{to{opacity:0}}@keyframes tipfade{0%,70%{opacity:1}100%{opacity:0}}
@media(max-width:760px){.topbar{padding:10px}.toolbox{padding:8px}.hero-choice{height:240px;padding:8px}.hero-choice img{height:145px}.select-screen{padding:4%}.hand{left:5%;right:5%;gap:2px}.battle-card{width:105px}.battle-card p{display:none}.battle-card b{font-size:10px}.hud{padding:7px;gap:5px}.unit-status{min-width:110px}.intent{font-size:10px}.energy{width:54px;height:54px}.energy strong{font-size:17px}.turn-controls{bottom:30%}.panel{left:10%;width:80%;padding:16px}.panel h2{font-size:24px}.node{width:43px;height:43px}.node em{top:42px;font-size:9px}}

<body>
<header class="topbar"><div class="brand">BRODUN <small>PLAYABLE PREVIEW</small></div><div>스프린트 1 · 박정완</div></header>
<nav class="toolbox" aria-label="미리보기 도구"><label>장면 <select id="scene"><option value="title">게임 시작</option><option value="select">캐릭터 선택</option><option value="battle">전투 데모</option><option value="map">맵</option><option value="gallery">에셋 모음</option></select></label><label>구역 <select id="area"><option value="0">1 잊혀진 회랑</option><option value="1">2 침잠의 수맥</option><option value="2">3 소멸의 화로</option></select></label><button id="restart">전투 재시작</button><button id="record">촬영 모드</button></nav>
<main><section class="stage" id="stage" aria-label="BRODUN 게임 화면"><img class="bg" id="bg" alt="게임 배경"><div class="shade"></div><canvas id="actors" width="1200" height="675" aria-label="전투 캐릭터와 카드 효과"></canvas><div class="overlay" id="overlay"></div><div class="record-tip">Esc 또는 F를 눌러 촬영 모드 종료</div></section><section class="gallery" id="gallery" hidden></section></main>
<p class="note">게임 시작부터 캐릭터 선택, 카드 전투, 적 피격, 승리와 보상까지 촬영할 수 있는 플레이용 미리보기입니다. 수치는 스프린트 시연용 임시값입니다. <a href="README_사용안내.md">팀 전달 안내</a> · <a href="manifest.json">프레임 좌표</a></p>
<script src="manifest.js"></script>
<script>
const base='Assets/BRODUNArt/',areas=['area01_forgotten_corridor','area02_submerged_waterway','area03_annihilation_furnace'],foes=['moss_slime','crystal_crawler','furnace_sentinel'];
const heroInfo={warrior:{name:'전사',desc:'검과 방패 · 안정적인 공격',cards:[['earth','지반 강타','피해 8',8,'attack'],['stone','바위 방벽','방어도 6',6,'guard'],['wind','돌풍 베기','피해 7',7,'attack']]},mage:{name:'마법사',desc:'불·얼음·번개의 원소술',cards:[['fire','화염탄','피해 8',8,'attack'],['ice','빙결 장막','방어도 6',6,'guard'],['lightning','낙뢰','피해 7',7,'attack']]},priest:{name:'사제',desc:'성스러운 힘과 회복',cards:[['water','정화의 파동','피해 7 · 회복 2',7,'drain'],['earth','대지의 가호','방어도 6',6,'guard'],['wind','심판의 바람','피해 8',8,'attack']]}};
const $=id=>document.getElementById(id),scene=$('scene'),area=$('area'),overlay=$('overlay'),stage=$('stage'),canvas=$('actors'),gallery=$('gallery'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const cache={};let current='title',selectedHero='warrior',selectedChoice='warrior',heroHp=30,enemyHp=30,energy=3,block=0,busy=false,heroMotion='idle',enemyMotion='idle',heroMotionAt=0,enemyMotionAt=0,effect=null,battleWon=false,epoch=0,statusTimer=0;
function image(src){if(!cache[src]){cache[src]=new Image();cache[src].src=base+src}return cache[src]}for(const asset of BRODUN_ASSETS.assets){image(asset.file);for(const frame of asset.frames||[])image(frame.file)}
function icon(id){return base+'Frames/ui_icons/'+id+'.png'}function framePath(name,motion,index=0){return `${base}Frames/${name}/${motion}_${String(index).padStart(2,'0')}.png`}function setBackground(kind=current){$('bg').src=base+'Backgrounds/'+(kind==='title'||kind==='select'?'title_background':areas[+area.value])+'.png'}
function go(next){current=next;scene.value=next;epoch++;busy=false;effect=null;setBackground();render()}function render(){overlay.className='overlay';gallery.hidden=current!=='gallery';stage.hidden=current==='gallery';if(current==='title')renderTitle();else if(current==='select')renderSelect();else if(current==='battle')renderBattle();else if(current==='map')renderMap();else renderGallery()}
function renderTitle(){overlay.classList.add('title-screen');overlay.innerHTML=`<h1 class="logo">BRODUN</h1><p class="subtitle">세 구역을 향한 여정</p><div class="menu"><button class="screen-btn" id="newGame">게임 시작</button><button class="screen-btn" id="quickBattle">전투 바로 보기</button><button class="screen-btn" id="assetsBtn">에셋 모음</button></div><span class="version">SPRINT 1 PLAYABLE PREVIEW</span>`;$('newGame').onclick=()=>go('select');$('quickBattle').onclick=()=>startBattle();$('assetsBtn').onclick=()=>go('gallery')}
function renderSelect(){overlay.classList.add('select-screen');const cards=Object.entries(heroInfo).map(([id,h])=>`<button class="hero-choice ${id===selectedChoice?'selected':''}" data-hero="${id}" aria-pressed="${id===selectedChoice}"><img src="${framePath(id,'idle')}" alt="${h.name}"><b>${h.name}</b><span>${h.desc}</span></button>`).join('');overlay.innerHTML=`<h2>운명을 함께할 영웅</h2><p>캐릭터를 선택하면 해당 속성 카드로 전투합니다.</p><div class="hero-grid">${cards}</div><button class="screen-btn select-go" id="begin">모험 시작</button>`;overlay.querySelectorAll('.hero-choice').forEach(b=>b.onclick=()=>{selectedChoice=b.dataset.hero;renderSelect()});$('begin').onclick=()=>{selectedHero=selectedChoice;startBattle()}}
function startBattle(){epoch++;current='battle';scene.value='battle';heroHp=30;enemyHp=[28,32,38][+area.value];energy=3;block=0;busy=false;battleWon=false;heroMotion=enemyMotion='idle';heroMotionAt=enemyMotionAt=performance.now();effect=null;setBackground();renderBattle();showStatus('카드를 선택해 공격하세요',1600)}
function cardMarkup(){return heroInfo[selectedHero].cards.map((c,i)=>`<button class="battle-card ${c[4]==='guard'?'guard':''}" data-card="${i}" ${energy<1||busy?'disabled':''}><span class="cost">1</span><img src="${icon(c[0])}" alt="${c[0]}"><b>${c[1]}</b><p>${c[2]}</p></button>`).join('')}
function renderBattle(){overlay.innerHTML=`<div class="hud"><div class="unit-status"><div class="unit-name">${heroInfo[selectedHero].name} ${block?`· 방어도 ${block}`:''}</div><div class="bar hero"><i id="heroBar"></i></div><span class="numbers" id="heroHp"></span></div><div class="intent">적 의도<br><b>공격 6</b></div><div class="unit-status enemy"><div class="unit-name">${['이끼 슬라임','수정 갑각수','화로 파수병'][+area.value]}</div><div class="bar"><i id="enemyBar"></i></div><span class="numbers" id="enemyHp"></span></div></div><div class="status-line" id="status" aria-live="polite"></div><div class="energy"><strong id="energyValue">${energy}/3</strong><small>행동력</small></div><div class="turn-controls"><button class="screen-btn" id="endTurn" ${busy||battleWon?'disabled':''}>턴 종료</button><button class="screen-btn" id="resetFight">다시 시작</button></div><div class="hand" id="hand">${cardMarkup()}</div>`;bindBattle();updateHud()}
function bindBattle(){overlay.querySelectorAll('.battle-card').forEach(b=>b.onclick=()=>playCard(+b.dataset.card,b));$('endTurn').onclick=enemyTurn;$('resetFight').onclick=startBattle}
function updateHud(){if(current!=='battle')return;const maxEnemy=[28,32,38][+area.value];$('heroBar').style.width=`${Math.max(0,heroHp)/30*100}%`;$('enemyBar').style.width=`${Math.max(0,enemyHp)/maxEnemy*100}%`;$('heroHp').textContent=`HP ${Math.max(0,heroHp)} / 30`;$('enemyHp').textContent=`HP ${Math.max(0,enemyHp)} / ${maxEnemy}`;$('energyValue').textContent=`${energy}/3`;overlay.querySelectorAll('.battle-card').forEach(b=>b.disabled=busy||battleWon||energy<1);$('endTurn').disabled=busy||battleWon}
function showStatus(text,duration=1000){if(current!=='battle')return;const s=$('status');if(!s)return;clearTimeout(statusTimer);s.textContent=text;s.classList.add('show');statusTimer=setTimeout(()=>s.classList.remove('show'),duration)}function setMotion(side,motion){if(side==='hero'){heroMotion=motion;heroMotionAt=performance.now()}else{enemyMotion=motion;enemyMotionAt=performance.now()}}
function playCard(index,button){if(busy||battleWon||energy<1)return;const token=epoch,card=heroInfo[selectedHero].cards[index],type=card[4];busy=true;energy--;button.classList.add('played');setMotion('hero','attack');effect={type:card[0],kind:type,start:performance.now(),duration:type==='guard'?700:650};updateHud();showStatus(`${card[1]}!`,850);setTimeout(()=>{if(token!==epoch||current!=='battle')return;if(type==='guard'){block+=card[3];popText(`방어 +${card[3]}`,31,49,'block-pop');stage.classList.add('flash');setTimeout(()=>stage.classList.remove('flash'),250)}else{setMotion('enemy','hurt');enemyHp=Math.max(0,enemyHp-card[3]);if(type==='drain')heroHp=Math.min(30,heroHp+2);popText(`-${card[3]}`,73,43,'damage-pop');stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),330);updateHud()}},470);setTimeout(()=>{if(token!==epoch||current!=='battle')return;effect=null;button.classList.remove('played');if(enemyHp<=0){setMotion('enemy','death');battleWon=true;showStatus('적을 처치했습니다!',1300);updateHud();setTimeout(()=>{if(token===epoch)showVictory()},1150)}else{setMotion('hero','idle');setMotion('enemy','idle');busy=false;updateHud();if(energy===0)showStatus('행동력을 모두 사용했습니다. 턴을 종료하세요.',1800)}},1050)}
function enemyTurn(){if(busy||battleWon)return;const token=epoch;busy=true;setMotion('enemy','attack');showStatus('적의 공격!',900);updateHud();setTimeout(()=>{if(token!==epoch||current!=='battle')return;const absorbed=Math.min(block,6),damage=6-absorbed;block=Math.max(0,block-6);heroHp=Math.max(0,heroHp-damage);setMotion('hero',damage?'hurt':'idle');popText(damage?`-${damage}`:'방어',25,43,damage?'damage-pop':'block-pop');stage.classList.add('shake');setTimeout(()=>stage.classList.remove('shake'),330);updateHud()},500);setTimeout(()=>{if(token!==epoch||current!=='battle')return;if(heroHp<=0){setMotion('hero','death');setTimeout(()=>{if(token===epoch)showDefeat()},1000)}else{energy=3;busy=false;setMotion('hero','idle');setMotion('enemy','idle');renderBattle();showStatus('새로운 턴 · 행동력 3',1200)}},1100)}
function popText(text,x,y,cls){const el=document.createElement('span');el.className='damage-pop '+cls;el.style.left=x+'%';el.style.top=y+'%';el.textContent=text;overlay.appendChild(el);setTimeout(()=>el.remove(),1050)}
function showVictory(){busy=true;overlay.insertAdjacentHTML('beforeend',`<div class="panel"><h2>전투 승리</h2><p>첫 번째 전투방을 완료했습니다.<br>보상을 하나 선택하세요.</p><div class="rewards"><button class="reward" data-reward="card"><img src="${icon('attack')}" alt="카드"><br>새 카드</button><button class="reward" data-reward="gold"><img src="${icon('gold')}" alt="골드"><br>골드 25</button></div><button class="screen-btn" id="skipReward">건너뛰기</button></div>`);overlay.querySelectorAll('[data-reward]').forEach(b=>b.onclick=()=>go('map'));$('skipReward').onclick=()=>go('map')}function showDefeat(){busy=true;overlay.insertAdjacentHTML('beforeend',`<div class="panel"><h2>여정 종료</h2><p>HP가 0이 되었습니다.</p><button class="screen-btn" id="retry">다시 도전</button> <button class="screen-btn" id="home">메인 메뉴</button></div>`);$('retry').onclick=startBattle;$('home').onclick=()=>go('title')}
function renderMap(){const types=['battle','puzzle','battle','event','battle','puzzle','battle','event','battle','boss'],names={battle:'전투',puzzle:'퍼즐',event:'이벤트',boss:'보스'};let nodes='';for(let i=0;i<10;i++){const row=i<3?0:i<6?1:2,col=row===0?i:row===1?i-3:i-6,count=row===2?4:3;nodes+=`<button class="node ${i===0?'done':''}" style="left:${15+col*70/(count-1)}%;top:${20+row*29}%" data-node="${i}"><img src="${icon(types[i])}" alt="${names[types[i]]}"><em>${i+1} ${names[types[i]]}</em></button>`}overlay.innerHTML=`<div class="maphead">${area.options[area.selectedIndex].text} · 전투방 1 완료</div><div class="mapnodes">${nodes}</div>`;overlay.querySelectorAll('.node').forEach(n=>n.onclick=()=>startBattle())}
function renderGallery(){overlay.innerHTML='';if(gallery.dataset.ready)return;gallery.innerHTML=BRODUN_ASSETS.assets.map(a=>`<article class="tile"><h3>${a.file.split('/').pop()}</h3><a href="${base+a.file}"><img src="${base+a.file}" alt="${a.file}"></a><p>${a.width} × ${a.height}${a.frames?' · '+a.frames.length+'프레임':''}</p></article>`).join('');gallery.dataset.ready='1'}
function drawActor(name,motion,x,y,at,now){const asset=BRODUN_ASSETS.assets.find(a=>a.file===`Sprites/${name}.png`),anim=BRODUN_ASSETS.animations.find(a=>a.name===motion);if(!asset||!anim)return;const elapsed=Math.max(0,now-at),n=Math.floor(elapsed*anim.fps/1000),idx=anim.loop?n%4:Math.min(3,n),row=BRODUN_ASSETS.animations.indexOf(anim),frame=asset.frames.find(f=>f.row===row&&f.column===idx);if(!frame)return;const im=image(frame.file),scale=.78;if(im.complete&&im.naturalWidth)ctx.drawImage(im,x-frame.pivotX*frame.width*scale,y-frame.height*scale,frame.width*scale,frame.height*scale)}
function drawEffect(now){if(!effect)return;const p=Math.min(1,(now-effect.start)/effect.duration),sx=390,sy=320,ex=830,ey=315,impact=p>.72;if(effect.kind==='guard'){ctx.save();ctx.globalAlpha=1-p*.6;ctx.strokeStyle=effect.type==='ice'?'#9ceaff':'#e3c276';ctx.lineWidth=8;ctx.beginPath();ctx.arc(330,310,52+p*45,Math.PI*.15,Math.PI*1.85);ctx.stroke();ctx.restore();return}ctx.save();ctx.globalCompositeOperation='lighter';if(effect.type==='lightning'){ctx.strokeStyle='#bff5ff';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(ex,80);for(let i=1;i<=8;i++)ctx.lineTo(ex+(i%2?25:-20),80+i*30*p);ctx.stroke()}else if(effect.type==='wind'){ctx.strokeStyle='#b7fff1';ctx.lineWidth=10;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(sx+(ex-sx)*p,ey,(35+i*16)*(1-p*.25),-.9,.9);ctx.stroke()}}else{const x=sx+(ex-sx)*p,y=sy+Math.sin(p*Math.PI)*-65;ctx.fillStyle=effect.type==='fire'?'#ff9e35':effect.type==='water'?'#6ee7ff':'#d8a95f';for(let i=0;i<5;i++){ctx.globalAlpha=1-i*.15;ctx.beginPath();ctx.arc(x-i*15,y+Math.sin(i)*5,18-i*2,0,Math.PI*2);ctx.fill()}}if(impact){ctx.globalAlpha=(1-p)*3;ctx.strokeStyle='#fff1ba';ctx.lineWidth=8;ctx.beginPath();ctx.arc(ex,ey,25+(p-.72)*250,0,Math.PI*2);ctx.stroke()}ctx.restore()}
function tick(now){ctx.clearRect(0,0,1200,675);if(current==='battle'){const y=[370,292,397][+area.value];drawActor(selectedHero,heroMotion,285,y,heroMotionAt,now);drawActor(foes[+area.value],enemyMotion,925,y,enemyMotionAt,now);drawEffect(now)}requestAnimationFrame(tick)}
scene.onchange=()=>scene.value==='battle'?startBattle():go(scene.value);area.onchange=()=>{setBackground();if(current==='battle')startBattle();else render()};$('restart').onclick=startBattle;$('record').onclick=()=>document.body.classList.toggle('recording');document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key.toLowerCase()==='f')document.body.classList.remove('recording')});setBackground();render();requestAnimationFrame(tick);
</script>
</body>
</html>
